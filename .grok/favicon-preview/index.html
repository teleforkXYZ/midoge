<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;background:#2a2a2a}
  .row{display:flex;align-items:center;gap:16px;padding:16px}
  img{background:#07080c;display:block}
  .lbl{color:#f4efe6;font:14px sans-serif}
</style>
</head>
<body>
  <div class="row">
    <img src="favicon.svg" width="16" height="16" alt="16">
    <span class="lbl">16</span>
    <img src="favicon.svg" width="32" height="32" alt="32">
    <span class="lbl">32</span>
    <img src="favicon.svg" width="64" height="64" alt="64">
    <span class="lbl">64</span>
  </div>
</body>
</html>
